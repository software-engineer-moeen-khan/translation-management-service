server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    server_tokens off;
    client_max_body_size 1m;

    # Redirect /docs to /docs/ relatively, so a published port or proxy host is kept.
    absolute_redirect off;

    # Translation exports are large and highly repetitive JSON.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types application/json text/plain text/css application/javascript application/yaml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /docs/openapi.yaml {
        types { }
        default_type "application/yaml; charset=utf-8";
    }

    location = /index.php {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Nothing else under the document root is executable PHP.
    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
