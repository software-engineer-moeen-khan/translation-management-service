services:
    app:
        build:
            context: .
            target: app
        environment:
            APP_NAME: "Translation Management Service"
            APP_ENV: ${APP_ENV:-local}
            APP_KEY: ${APP_KEY:-}
            APP_DEBUG: "false"
            APP_URL: http://localhost:${APP_PORT:-8080}
            LOG_CHANNEL: stderr
            DB_CONNECTION: mysql
            DB_HOST: mysql
            DB_PORT: 3306
            DB_DATABASE: ${DB_DATABASE:-translations}
            DB_USERNAME: ${DB_USERNAME:-translations}
            DB_PASSWORD: ${DB_PASSWORD:-secret}
            CACHE_STORE: redis
            REDIS_CLIENT: phpredis
            REDIS_HOST: redis
            SESSION_DRIVER: array
            QUEUE_CONNECTION: sync
            TRANSLATIONS_EXPORT_PUBLIC: ${TRANSLATIONS_EXPORT_PUBLIC:-false}
            TRANSLATIONS_EXPORT_CDN_MAX_AGE: ${TRANSLATIONS_EXPORT_CDN_MAX_AGE:-0}
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "SCRIPT_NAME=/fpm-ping SCRIPT_FILENAME=/fpm-ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong"]
            interval: 5s
            timeout: 3s
            retries: 20
        restart: unless-stopped

    web:
        build:
            context: .
            target: web
        ports:
            - "${APP_PORT:-8080}:80"
        depends_on:
            app:
                condition: service_healthy
        restart: unless-stopped

    mysql:
        image: mysql:8.4
        environment:
            MYSQL_DATABASE: ${DB_DATABASE:-translations}
            MYSQL_USER: ${DB_USERNAME:-translations}
            MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
            MYSQL_RANDOM_ROOT_PASSWORD: "yes"
        volumes:
            - mysql-data:/var/lib/mysql
        healthcheck:
            test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
            interval: 5s
            timeout: 3s
            retries: 30
        restart: unless-stopped

    redis:
        image: redis:7-alpine
        command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 20
        restart: unless-stopped

    # Runs the test suite with coverage: docker compose run --rm test
    test:
        build:
            context: .
            target: test
        profiles: ["test"]

volumes:
    mysql-data:
